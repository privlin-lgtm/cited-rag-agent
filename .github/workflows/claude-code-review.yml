name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scope the review
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          SKIP_RE: '(^|/)(package-lock\.json|deno\.lock|pnpm-lock\.yaml|yarn\.lock)$|(^|/)__screenshots__/|\.(png|jpe?g|gif|webp|ico|woff2?|ttf|otf|pdf|zip|mp4|mov)$'
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments" > "$RUNNER_TEMP/comments.json"
          summaries='[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review:summary -->")))]'
          comment_id=$(jq -r "$summaries | last | .id // \"\"" "$RUNNER_TEMP/comments.json")
          jq -r "$summaries | last | .body // \"\"" "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/last-summary.md"
          prev=$(grep -oE 'claude-review:sha=[0-9a-f]{40}' "$RUNNER_TEMP/last-summary.md" | cut -d= -f2 || [ $? -eq 1 ])
          prev_important=$(grep -oE 'claude-review:important=[0-9]+' "$RUNNER_TEMP/last-summary.md" | cut -d= -f2 || [ $? -eq 1 ])
          rules_ref="origin/$BASE_REF"
          git cat-file -e "$rules_ref:.github/claude-review/prompt.md" 2>/dev/null || rules_ref="$HEAD_SHA"
          mode=full
          range="$base..$HEAD_SHA"
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            mode=dependabot
          elif [ "$HAS_TOKEN" != true ]; then
            mode=nosecret
          elif [ "$prev" = "$HEAD_SHA" ]; then
            mode=already
          elif [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$HEAD_SHA"; then
            mode=incremental
            range="$prev..$HEAD_SHA"
          fi
          git diff --name-only "$range" > "$RUNNER_TEMP/changed.txt"
          { grep -Ev "$SKIP_RE" "$RUNNER_TEMP/changed.txt" || [ $? -eq 1 ]; } > "$RUNNER_TEMP/reviewable.txt"
          if { [ "$mode" = full ] || [ "$mode" = incremental ]; } && [ ! -s "$RUNNER_TEMP/reviewable.txt" ]; then
            mode=trivial
          fi
          {
            echo "mode=$mode"
            echo "comment_id=$comment_id"
            echo "prev=$prev"
            echo "prev_important=${prev_important:-0}"
            echo "diff_bytes=$(xargs -r -d '\n' git diff "$range" -- < "$RUNNER_TEMP/reviewable.txt" | wc -c)"
            echo "range=$range"
          } >> "$GITHUB_OUTPUT"
          if [ "$mode" = full ] || [ "$mode" = incremental ]; then
            {
              echo "# Pull request #$PR"
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"## Title\n\n" + .title + "\n\n## Body\n\n" + (.body // "(empty)")'
              if [ "$mode" = incremental ]; then
                echo
                echo '## Last review summary'
                echo
                cat "$RUNNER_TEMP/last-summary.md"
              fi
            } > .claude-review-context.md
            {
              echo 'prompt<<CLAUDE_REVIEW_PROMPT_END'
              git show "$rules_ref:.github/claude-review/prompt.md"
              echo
              echo '## This run'
              echo
              echo "- Repository: $GITHUB_REPOSITORY"
              echo "- Pull request: #$PR"
              echo "- Head commit: $HEAD_SHA"
              echo "- Rules ref: $rules_ref"
              echo "- Mode: $mode"
              echo "- Review range: \`git diff $range\`"
              echo "- PR title, body and the last review summary: \`.claude-review-context.md\`"
              echo
              echo '## Files to account for'
              echo
              sed 's/^/- /' "$RUNNER_TEMP/reviewable.txt"
              echo 'CLAUDE_REVIEW_PROMPT_END'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Review
        id: claude
        if: steps.scope.outputs.mode == 'full' || steps.scope.outputs.mode == 'incremental'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.scope.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Task,Agent,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","required":["reviewed_sha","files_reviewed","files_skipped","findings","not_checked"],"properties":{"reviewed_sha":{"type":"string"},"files_reviewed":{"type":"array","items":{"type":"string"}},"files_skipped":{"type":"array","items":{"type":"object","required":["path","reason"],"properties":{"path":{"type":"string"},"reason":{"type":"string"}}}},"findings":{"type":"array","items":{"type":"object","required":["severity","pass","path","line","title","detail","posted_inline"],"properties":{"severity":{"type":"string","enum":["important","nit"]},"pass":{"type":"string"},"path":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"detail":{"type":"string"},"posted_inline":{"type":"boolean"}}}},"not_checked":{"type":"array","items":{"type":"string"}}}}'

      - name: Publish and verify the review
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: ${{ steps.scope.outputs.mode }}
          PREV: ${{ steps.scope.outputs.prev }}
          PREV_IMPORTANT: ${{ steps.scope.outputs.prev_important }}
          DIFF_BYTES: ${{ steps.scope.outputs.diff_bytes }}
          RANGE: ${{ steps.scope.outputs.range }}
          COMMENT_ID: ${{ steps.scope.outputs.comment_id }}
          OUTCOME: ${{ steps.claude.outcome }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          short=${HEAD_SHA:0:7}
          blob="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$HEAD_SHA"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$RUNNER_TEMP/summary.md"
          post() {
            printf '\n<!-- claude-review:summary -->\n%s\n' "${1:-}" >> "$body"
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@"$body" > /dev/null
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$body" > /dev/null
            fi
            cat "$body" >> "$GITHUB_STEP_SUMMARY"
          }
          case "$MODE" in
            already)
              echo "Already reviewed at $HEAD_SHA, with $PREV_IMPORTANT important finding(s)." >> "$GITHUB_STEP_SUMMARY"
              [ "$PREV_IMPORTANT" -eq 0 ] || { echo "::error::$PREV_IMPORTANT important finding(s) on $short are still open"; exit 1; }
              exit 0 ;;
            trivial)
              echo "Not sent for review: every changed file is a lockfile, image or screenshot baseline." >> "$GITHUB_STEP_SUMMARY"
              [ "$PREV_IMPORTANT" -eq 0 ] || { echo "::error::$PREV_IMPORTANT important finding(s) from ${PREV:0:7} are still open"; exit 1; }
              exit 0 ;;
            dependabot)
              echo "::notice::Not reviewed: a Dependabot update. Bot pull requests get no secrets and a read-only token, so CI is the only check on this one."
              echo "Not reviewed: a Dependabot update. CI is the only check on this one." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            nosecret)
              echo "**Not reviewed.** This repository has no \`CLAUDE_CODE_OAUTH_TOKEN\` secret, so the reviewer cannot run. Add the secret, then re-run this check." > "$body"
              post
              exit 1 ;;
          esac
          if [ "$OUTCOME" != success ] || [ -z "$RESULT" ]; then
            echo "**Review failed for \`$short\`.** The review step ended as \`$OUTCOME\`. Treat this pull request as unreviewed. [Run log]($run_url)" > "$body"
            post
            exit 1
          fi
          res=$(jq -c '[.[] | select(.type == "result")] | last' "$EXEC_FILE")
          missing=$(jq -r --rawfile files "$RUNNER_TEMP/reviewable.txt" '($files | split("\n") | map(select(length > 0))) - (.files_reviewed + [.files_skipped[].path]) | .[]' <<< "$RESULT")
          jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .input | tostring' "$EXEC_FILE" > "$RUNNER_TEMP/tool-inputs.txt"
          full_diffs=$(jq --arg r "$RANGE" '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .input.command? // empty | select(test("git diff") and contains($r) and (test(" -- ") | not) and (test("--(stat|name-only|name-status|numstat|shortstat)") | not))] | length' "$EXEC_FILE")
          if [ "$DIFF_BYTES" -le 25000 ] && [ "$full_diffs" -gt 0 ]; then
            unread=""
          else
            jq -r '.files_skipped[].path' <<< "$RESULT" > "$RUNNER_TEMP/skipped.txt"
            unread=$(while read -r f; do [ -z "$f" ] || grep -qxF -- "$f" "$RUNNER_TEMP/skipped.txt" || grep -qF -- "$f" "$RUNNER_TEMP/tool-inputs.txt" || echo "$f"; done < "$RUNNER_TEMP/reviewable.txt")
          fi
          reviewed=$(jq -r '.reviewed_sha' <<< "$RESULT")
          important=$(jq '[.findings[] | select(.severity == "important")] | length' <<< "$RESULT")
          nits=$(jq '[.findings[] | select(.severity == "nit")] | length' <<< "$RESULT")
          usage=$(jq -r '"\(.num_turns) turns, \((.duration_ms / 6000 | floor) / 10) min, $\((.total_cost_usd * 100 | round) / 100) at API list prices"' <<< "$res")
          denied=$(jq -r '[.permission_denials[]?.tool_name] | unique | join(", ")' <<< "$res")
          problems=()
          [ -z "$missing" ] || problems+=("Files neither reviewed nor skipped: $(paste -sd, <<< "$missing" | sed 's/,/, /g')")
          [ "$(jq '.files_reviewed | length' <<< "$RESULT")" -gt 0 ] || problems+=("Every file was skipped, so nothing was reviewed.")
          [ -z "$unread" ] || problems+=("No tool call read these files: $(paste -sd, <<< "$unread" | sed 's/,/, /g')")
          if [ ${#reviewed} -lt 7 ] || [ "${HEAD_SHA#"$reviewed"}" = "$HEAD_SHA" ]; then
            problems+=("The review reports commit \`$reviewed\`, not \`$short\`.")
          fi
          scope="the whole pull request"
          [ "$MODE" != incremental ] || scope="changes since \`${PREV:0:7}\`"
          {
            echo "## Claude review of \`$short\`"
            echo
            if [ ${#problems[@]} -gt 0 ]; then
              echo '**Review incomplete. Treat this pull request as unreviewed.**'
              echo
              printf -- '- %s\n' "${problems[@]}"
              echo
            fi
            echo "**Important: $important. Nits: $nits.** Scope: $scope."
            if [ $((important + nits)) -gt 0 ]; then
              echo
              echo '| Severity | Pass | Where | Finding |'
              echo '|---|---|---|---|'
              jq -r --arg u "$blob" '.findings[] | "| \(if .severity == "important" then "Important" else "Nit" end) | \(.pass | gsub("\\|"; "\\|")) | [\(.path):\(.line)](\($u)/\(.path)#L\(.line)) | \(.title | gsub("\\|"; "\\|") | gsub("\n"; " ")) |"' <<< "$RESULT"
              jq -r '.findings[] | select(.posted_inline | not) | "\n**\(.title)** (`\(.path):\(.line)`): \(.detail)"' <<< "$RESULT"
            fi
            jq -r 'if (.files_skipped | length) > 0 then "\n**Skipped:** " + ([.files_skipped[] | "`\(.path)` (\(.reason))"] | join("; ")) else empty end' <<< "$RESULT"
            jq -r 'if (.not_checked | length) > 0 then "\n**Not checked:** " + (.not_checked | join("; ")) else empty end' <<< "$RESULT"
            echo
            echo "<sub>$usage. [Run log]($run_url)${denied:+. Tools refused: $denied}</sub>"
          } > "$body"
          if [ ${#problems[@]} -gt 0 ]; then
            post
            exit 1
          fi
          post "<!-- claude-review:sha=$HEAD_SHA -->
          <!-- claude-review:important=$important -->"
          if [ "$important" -gt 0 ]; then
            echo "::error::$important important finding(s) on $short"
            exit 1
          fi
