[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
# Several dependencies (chromadb, sentence-transformers, pypdf, rich) either ship partial
# stubs or none at all; ignoring missing imports is a pragmatic default rather than drowning
# in third-party stub gaps. Our own code under rag/ is still fully checked.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
